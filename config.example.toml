# 本地配置模板。
#
# 用法：复制为 config.toml 后按需修改。config.toml 已在 .gitignore 中，
# 只留在这台机器上，不会被提交或部署；CI 没有它时会使用 tools/common.py 的默认值。
#
#   copy config.example.toml config.toml   (Windows cmd)
#   cp config.example.toml config.toml     (bash)

# 数据源：枢纽数据库（LiveTranslate 与 danmaku-it 都往这个文件写）。
# 相对路径以仓库根为基准，也可以写绝对路径。
[source]
db = ".data/translation_history.db"
session_gap_min = 30   # 相邻记录超过这个间隔就算新的一场
min_records = 20       # 少于这个条数的片段当作误录，不进站点
quiet_min = 10         # 最后一条记录静默超过这个分钟数，才认为直播已结束
time_window = "23:30-01:30"  # 只收开场时间落在此窗口内的场次（跨零点），留空 = 不过滤
time_window_keep = []        # 例外保留：非深夜时段的正式场次，按场次名登记

[site]
dir = "site"           # 前端源码 + 数据
dist = "dist"          # 构建产物（不入库，由 CI 生成）

# 主播动态来自 live-capture 抓下来的 dynamics 表。
# 默认走 ssh 只读手机库；不需要动态时把 ssh / db 留空即可。
[capture]
ssh = ""               # 本机 ~/.ssh/config 里的别名，例如 "v20"
db = ""                # 手机上的 capture.db 路径
mid = 0                # 只导出这位 up 主的动态

[publish]
remote = "origin"
branch = "main"
auto_push = false      # false = review 模式：自动任务只做导出/构建/本地提交，
                       # 人工确认内容后执行 publish.cmd --push 才会上 GitHub
